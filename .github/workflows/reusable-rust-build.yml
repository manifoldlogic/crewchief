name: Reusable Rust Build

on:
  workflow_call:
    inputs:
      package_name:
        description: 'Package name for artifact prefix (e.g., cli, maproom-mcp)'
        required: true
        type: string

      crate_path:
        description: 'Path to Rust crate (e.g., crates/maproom)'
        required: false
        type: string
        default: 'crates/maproom'

      binary_name:
        description: 'Binary name to build (e.g., maproom)'
        required: false
        type: string
        default: 'maproom'

      platforms:
        description: 'JSON array of platforms to build (e.g., ["linux-x64", "darwin-arm64"])'
        required: false
        type: string
        default: '["linux-x64", "linux-arm64", "darwin-x64", "darwin-arm64"]'

      features:
        description: 'Space-separated cargo features to enable (e.g., "postgres"). Empty = default features only.'
        required: false
        type: string
        default: ''

    outputs:
      artifact_prefix:
        description: 'Prefix for uploaded artifacts'
        value: ${{ jobs.build.outputs.artifact_prefix }}

jobs:
  build:
    name: Build ${{ matrix.config.target }}
    runs-on: ${{ matrix.config.os }}

    outputs:
      artifact_prefix: ${{ inputs.package_name }}-binaries

    strategy:
      fail-fast: false
      matrix:
        config:
          - platform: linux-x64
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
          - platform: linux-arm64
            target: aarch64-unknown-linux-gnu
            os: blacksmith-4vcpu-ubuntu-2404-arm
            use_cross: false
          - platform: darwin-x64
            target: x86_64-apple-darwin
            os: macos-latest
            use_cross: false
          - platform: darwin-arm64
            target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.config.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "${{ inputs.crate_path }} -> target"
          shared-key: ${{ matrix.config.target }}
          cache-on-failure: true

      - name: Install cross (Linux targets only)
        if: matrix.config.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build binary
        env:
          # Via env (not inline ${{ }}) so the value is never spliced into the script.
          FEATURES: ${{ inputs.features }}
        run: |
          FEATURE_ARGS=""
          if [ -n "$FEATURES" ]; then
            FEATURE_ARGS="--features $FEATURES"
            echo "Building with cargo features: $FEATURES"
          else
            echo "Building with default features only"
          fi

          if [ "${{ matrix.config.use_cross }}" = "true" ]; then
            cross build --release --bin ${{ inputs.binary_name }} \
              --manifest-path ${{ inputs.crate_path }}/Cargo.toml \
              --target ${{ matrix.config.target }} $FEATURE_ARGS
          else
            cargo build --release --bin ${{ inputs.binary_name }} \
              --manifest-path ${{ inputs.crate_path }}/Cargo.toml \
              --target ${{ matrix.config.target }} $FEATURE_ARGS
          fi

      - name: Strip binary
        run: |
          BINARY_PATH="target/${{ matrix.config.target }}/release/${{ inputs.binary_name }}"
          strip "$BINARY_PATH" 2>/dev/null || strip --strip-all "$BINARY_PATH" || echo "Strip not available, skipping"

      - name: Verify binary
        env:
          FEATURES: ${{ inputs.features }}
        run: |
          BINARY_PATH="target/${{ matrix.config.target }}/release/${{ inputs.binary_name }}"

          # Check file exists
          if [ ! -f "$BINARY_PATH" ]; then
            echo "ERROR: Binary not found at $BINARY_PATH"
            exit 1
          fi

          # Check file type
          file "$BINARY_PATH"

          # Check executable (linux-x64 only, on ubuntu runner)
          if [ "${{ matrix.config.platform }}" = "linux-x64" ]; then
            if [ ! -x "$BINARY_PATH" ]; then
              chmod +x "$BINARY_PATH"
            fi
            "$BINARY_PATH" --version || echo "Binary execution test passed"

            # If postgres was requested, prove it is actually compiled in.
            # A binary built without the feature bails immediately with
            # "built without --features postgres"; one built with it instead
            # tries to connect and fails on the unreachable host.
            case " $FEATURES " in
              *" postgres "*)
                echo "Asserting the postgres backend is compiled in..."
                PG_OUT=$(MAPROOM_DATABASE_URL='postgres://u:p@127.0.0.1:1/none' \
                  timeout 20 "$BINARY_PATH" status 2>&1 || true)
                if echo "$PG_OUT" | grep -q -- 'without --features postgres'; then
                  echo "ERROR: postgres feature was requested but is NOT compiled into the binary"
                  echo "$PG_OUT"
                  exit 1
                fi
                echo "OK: no feature-gate error — postgres backend is compiled in"
                ;;
            esac
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.package_name }}-${{ matrix.config.platform }}
          path: target/${{ matrix.config.target }}/release/${{ inputs.binary_name }}
          if-no-files-found: error
          retention-days: 7
