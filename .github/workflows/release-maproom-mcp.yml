name: Release Maproom MCP (npm)

on:
  push:
    tags:
      - '@crewchief/maproom-mcp@v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip actual publish)'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write  # For npm provenance

jobs:
  # Job 1: Build Rust binaries (reusable)
  build-rust:
    name: Build Rust Binaries
    uses: ./.github/workflows/reusable-rust-build.yml
    with:
      package_name: maproom-mcp
      binary_name: maproom
      crate_path: crates/maproom
      # maproom-mcp bundles its OWN copy of the binary (it does not reuse the
      # CLI's), so it needs the same flag or the MCP server stays SQLite-only.
      features: postgres

  # Job 2: Build TypeScript (reusable)
  build-typescript:
    name: Build TypeScript
    uses: ./.github/workflows/reusable-typescript-build.yml
    with:
      workspace_filter: '@crewchief/maproom-mcp...'
      artifact_name: 'maproom-mcp-typescript'

  # Job 3: Validate and publish (depends on both builds)
  publish:
    name: Publish to npm
    # GitHub-hosted on purpose (exception to the Blacksmith convention):
    # npm publishes with sigstore provenance via OIDC, and the registry
    # rejects provenance from self-hosted-class runners (E422, seen on the
    # v1.7.0 release). The job is light — download artifacts, build TS, publish.
    runs-on: ubuntu-latest
    needs: [build-rust, build-typescript]
    permissions:
      contents: read
      id-token: write  # Required for OIDC Trusted Publishers

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Keep in sync with the npm pin below: npm 12 requires
          # ^22.22.2 || ^24.15.0 || >=26.0.0. Node 20 (EOL 2026-04-30) fails
          # that with EBADENGINE. Latest 22.x is 22.23.2, so '22' clears it.
          node-version: '22'
          registry-url: 'https://registry.npmjs.org/'

      - name: Upgrade npm for OIDC support
        # Pinned to a major deliberately. An unpinned npm@latest broke this
        # job with no change on our side when npm 12 dropped Node 20. npm 12
        # provides the OIDC trusted publishing this step exists for.
        # Bump this and node-version above together.
        run: npm install -g npm@12

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Download Rust binaries (Linux x64)
        uses: actions/download-artifact@v4
        with:
          name: maproom-mcp-linux-x64
          path: packages/maproom-mcp/bin/linux-x64/

      - name: Download Rust binaries (Linux ARM64)
        uses: actions/download-artifact@v4
        with:
          name: maproom-mcp-linux-arm64
          path: packages/maproom-mcp/bin/linux-arm64/

      - name: Download Rust binaries (Darwin x64)
        uses: actions/download-artifact@v4
        with:
          name: maproom-mcp-darwin-x64
          path: packages/maproom-mcp/bin/darwin-x64/

      - name: Download Rust binaries (Darwin ARM64)
        uses: actions/download-artifact@v4
        with:
          name: maproom-mcp-darwin-arm64
          path: packages/maproom-mcp/bin/darwin-arm64/

      - name: Download TypeScript dist
        uses: actions/download-artifact@v4
        with:
          name: maproom-mcp-typescript
          path: packages

      - name: Debug - Show downloaded files
        run: |
          echo "=== packages/ directory ==="
          ls -la packages/ || echo "packages/ not found"
          echo "=== packages/maproom-mcp/ ==="
          ls -la packages/maproom-mcp/ || echo "packages/maproom-mcp/ not found"
          echo "=== packages/maproom-mcp/dist/ ==="
          ls -la packages/maproom-mcp/dist/ || echo "packages/maproom-mcp/dist/ not found"

      - name: Verify binary structure
        run: |
          echo "Checking binary structure..."
          ls -R packages/maproom-mcp/bin/

          # Verify all 4 platforms present
          for platform in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            if [ ! -f "packages/maproom-mcp/bin/$platform/maproom" ]; then
              echo "ERROR: Missing binary for $platform"
              exit 1
            fi
            echo "✓ $platform binary found"
          done

      - name: Set executable permissions
        run: |
          find packages/maproom-mcp/bin -name "maproom" -exec chmod +x {} \;

      - name: Verify binary sizes
        run: |
          #!/bin/bash
          set -e

          MIN_SIZE=1048576      # 1MB
          MAX_SIZE=104857600    # 100MB

          for platform in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            BINARY="packages/maproom-mcp/bin/$platform/maproom"
            SIZE=$(stat -c%s "$BINARY")

            if [ "$SIZE" -lt "$MIN_SIZE" ]; then
              echo "ERROR: $platform binary too small ($SIZE bytes)"
              exit 1
            fi

            if [ "$SIZE" -gt "$MAX_SIZE" ]; then
              echo "ERROR: $platform binary too large ($SIZE bytes)"
              exit 1
            fi

            echo "✓ $platform binary size valid ($SIZE bytes)"
          done

      - name: Verify TypeScript dist directories
        run: |
          # Verify maproom-mcp dist/
          if [ ! -d "packages/maproom-mcp/dist" ]; then
            echo "ERROR: maproom-mcp dist not found"
            exit 1
          fi
          echo "✓ maproom-mcp dist found"
          ls -la packages/maproom-mcp/dist/

          # Verify daemon-client is embedded in maproom-mcp dist
          if [ ! -d "packages/maproom-mcp/dist/daemon-client" ]; then
            echo "ERROR: daemon-client embedded module not found"
            exit 1
          fi
          echo "✓ daemon-client embedded module found"
          ls -la packages/maproom-mcp/dist/daemon-client/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pack package
        run: |
          cd packages/maproom-mcp
          # Clean up old tarballs
          rm -f *.tgz
          pnpm pack

      - name: Verify package
        run: |
          cd packages/maproom-mcp
          # Discover by extension, not by a guessed name. `pnpm pack` names the
          # tarball after the package, and for a scoped package that name has
          # changed shape over time: this globbed `maproom-mcp-*.tgz`, but
          # pnpm 10 emits `crewchief-maproom-mcp-<version>.tgz` (scope
          # flattened, matching npm).
          #
          # Loop rather than `TARBALL=$(ls *.tgz)`: under `bash -e` a failing
          # `ls` aborts the step before the error below can print, so the
          # operator sees a bare "cannot access" instead of the real problem --
          # which is exactly how the 3.6.0 failure presented.
          TARBALL=""
          TARBALL_COUNT=0
          for candidate in ./*.tgz; do
            [ -f "$candidate" ] || continue
            TARBALL="${candidate#./}"
            TARBALL_COUNT=$((TARBALL_COUNT + 1))
          done
          if [ "$TARBALL_COUNT" -eq 0 ]; then
            echo "ERROR: no tarball produced by pnpm pack"
            exit 1
          fi
          if [ "$TARBALL_COUNT" -ne 1 ]; then
            echo "ERROR: expected exactly one tarball, found $TARBALL_COUNT"
            exit 1
          fi
          echo "Package created: $TARBALL"
          tar -tzf "$TARBALL" | head -20

          # Verify all 4 binaries in tarball
          echo "Verifying binaries in tarball..."
          tar -tzf "$TARBALL" | grep "package/bin/linux-x64/maproom"
          tar -tzf "$TARBALL" | grep "package/bin/linux-arm64/maproom"
          tar -tzf "$TARBALL" | grep "package/bin/darwin-x64/maproom"
          tar -tzf "$TARBALL" | grep "package/bin/darwin-arm64/maproom"
          echo "✓ All binaries present in tarball"

          # Hand the exact verified filename to the publish step, so discovery
          # happens once and publish cannot pick a different file.
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"

      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        working-directory: packages/maproom-mcp
        # Publish the exact tarball that "Pack package" produced and "Verify
        # package" checked -- and that "Upload package artifact" archives.
        # This matters most here: the verify step asserts all four platform
        # binaries are inside the tarball. Publishing the directory would make
        # npm re-pack from source, so that binary check would not apply to what
        # actually ships.
        #
        # npm rather than `pnpm publish`: pnpm forwards its own --no-git-checks
        # down to npm, and npm >= 12 hard-errors on unknown flags
        # (EUNKNOWNCONFIG) where npm 10 silently ignored them. npm has no git
        # cleanliness check, so the flag is unnecessary rather than tolerated.
        # Packing stays with pnpm, so any workspace-protocol rewriting still
        # happens at pack time.
        run: |
          # Set by "Verify package" -- publish the exact file that was verified,
          # including its four-binary check.
          if [ -z "${TARBALL:-}" ]; then
            echo "ERROR: TARBALL not set by the Verify package step"
            exit 1
          fi
          echo "Publishing $TARBALL"
          npm publish "$TARBALL" --access public

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-package-maproom-mcp
          path: packages/maproom-mcp/*.tgz
          retention-days: 90
